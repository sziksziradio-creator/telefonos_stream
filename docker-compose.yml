services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    network_mode: host          # WebRTC UDP + RTSP + SRT miatt kell
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  caddy:
    image: caddy:2
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv/www:ro
      - caddy_data:/data

  control:
    build: ./server
    network_mode: host
    restart: unless-stopped
    environment:
      PORT: 3000
      ADMIN_PIN: ${ADMIN_PIN:-1234}
      VMIX_HOST: ${VMIX_HOST:-}
      OBS_URL: ${OBS_URL:-}
      OBS_PASSWORD: ${OBS_PASSWORD:-}

volumes:
  caddy_data:
